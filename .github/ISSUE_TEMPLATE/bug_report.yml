name: Bug Report
description: Report broken HTML normalization, truncation issues, or Bot API type mismatches
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! Minimal HTML snippets or JSON payloads that reproduce the problem help us fix it quickly.
  - type: input
    id: version
    attributes:
      label: Crate version
      placeholder: "0.0.1"
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Minimal reproducing input (HTML or Rust snippet)
      render: html
      placeholder: "<article><p>...</p></article>"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual output or Telegram Bot API error
      description: Paste the rendered Rich HTML / JSON or the error description returned by `sendRichMessage`.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
