[package]
name = "telegram-rich"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
description = "Telegram Bot API rich messages toolkit: normalize arbitrary HTML into Telegram Rich HTML, fit it into official limits, and serde types for InputRichMessage / InputRichBlock / RichText."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ElleryHe/telegram-rich"
documentation = "https://docs.rs/telegram-rich"
readme = "README.md"
keywords = ["telegram", "bot", "rich-message", "html", "sanitize"]
categories = ["api-bindings", "text-processing", "encoding"]
include = ["src/**/*", "examples/**/*", "tests/**/*", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = ["html"]
## HTML → Telegram Rich HTML normalizer (pulls in an HTML5 parser).
html = ["dep:scraper", "dep:ego-tree", "dep:url"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
scraper = { version = "0.29.0", optional = true, default-features = false }
ego-tree = { version = "0.11", optional = true }
url = { version = "2.5.8", optional = true }

[dev-dependencies]
pretty_assertions = "1.4.1"
serde_json = "1.0.154"

[[example]]
name = "rss_article"
required-features = ["html"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
